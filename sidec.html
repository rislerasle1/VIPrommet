<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kioskverter beta</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif}body{background:linear-gradient(135deg,#112f4a,#173b5d);color:#fff}.s{height:100%;display:flex;align-items:center;justify-content:center;text-align:center}.label{display:inline-block;padding:.65em 1em;border-radius:999px;background:#ef3e36;font-weight:900}h1{font-size:clamp(44px,6vw,100px)}.sub{color:#d6e1ea;font-size:clamp(20px,2vw,34px);font-weight:700}</style></head><body><div class="s"><div><div class="label">KIOSKVERTER</div><h1>Hasle-Løren <span id="team">–</span></h1><div id="thanks" class="sub"></div><div id="error"></div></div></div><script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script><script src="sheets-config.js"></script><script src="google-sheets-loader.js"></script><script>const sod=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());loadKioskData(true).then(d=>{const n=sod(new Date()),p=d.dutyPeriods.find(x=>n>=sod(x.start)&&n<=sod(x.end));team.textContent=p?`${p.team} (${p.born})`:"Ingen vaktperiode angitt";thanks.textContent=d.settings.dutyThanks||"Takk for innsatsen!"}).catch(e=>error.textContent=e.message)</script></body></html>
