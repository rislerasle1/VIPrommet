<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kioskstatus beta</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif}body{background:linear-gradient(#f8fbfe,#eef4f8);color:#112f4a}.s{height:100%;display:flex;align-items:center;justify-content:center;text-align:center}#h{font-size:clamp(28px,3.5vw,58px);font-weight:900;color:#ef3e36;min-height:1.4em}#clock{font-size:clamp(82px,16vw,220px);font-weight:900;line-height:.95}#sub{font-size:clamp(24px,3vw,48px);font-weight:800;min-height:1.3em}#date{font-size:clamp(16px,1.5vw,26px);color:#708394}#error{color:#ef3e36}</style></head><body><div class="s"><div><div id="h"></div><div id="clock">00:00:00</div><div id="sub"></div><div id="date"></div><div id="error"></div></div></div><script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script><script src="sheets-config.js"></script><script src="google-sheets-loader.js"></script><script>const days=["Søndag","Mandag","Tirsdag","Onsdag","Torsdag","Fredag","Lørdag"],months=["januar","februar","mars","april","mai","juni","juli","august","september","oktober","november","desember"];let data;const mins=s=>{const [h,m]=s.split(":").map(Number);return h*60+m},two=n=>String(n).padStart(2,"0");function update(){const n=new Date(),d=days[n.getDay()];clock.textContent=`${two(n.getHours())}:${two(n.getMinutes())}:${two(n.getSeconds())}`;date.textContent=`${d} ${n.getDate()}. ${months[n.getMonth()]} ${n.getFullYear()}`;if(!data)return;const o=data.openingHours.find(x=>x.day===d);if(!o)return sub.textContent="Åpningstid ikke angitt";const cur=n.getHours()*60+n.getMinutes();if(cur>=mins(o.open)&&cur<mins(o.close)){h.textContent=data.settings.openMessage;sub.textContent=""}else if(cur<mins(o.open)){h.textContent="";sub.textContent=data.settings.closedMessage.replace("{open}",o.open)}else{h.textContent="";sub.textContent=""}}loadKioskData(true).then(x=>{data=x;update()}).catch(e=>error.textContent=e.message);update();setInterval(update,1000)</script></body></html>
