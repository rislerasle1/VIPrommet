<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kioskverter</title>
<style>
  :root{
    --navy:#112f4a;
    --red:#ef3e36;
    --white:#fff;
    --muted:#d6e1ea;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(135deg,#112f4a 0%, #173b5d 100%);
    color:var(--white);
  }
  .screen{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:4vh 4vw;
    text-align:center;
  }
  .box{
    max-width:1000px;
    animation:fadeUp .55s ease-out both;
  }
  .label{
    display:inline-block;
    margin-bottom:2vh;
    padding:.65em 1em;
    border-radius:999px;
    background:var(--red);
    font-size:clamp(18px,1.8vw,30px);
    font-weight:900;
    letter-spacing:.04em;
  }
  h1{
    margin:0;
    font-size:clamp(44px,6vw,100px);
    line-height:1.02;
    font-weight:900;
  }
  .sub{
    margin-top:2vh;
    color:var(--muted);
    font-size:clamp(20px,2vw,34px);
    font-weight:700;
  }
  @keyframes fadeUp{
    from{opacity:0; transform:translateY(16px)}
    to{opacity:1; transform:none}
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="box">
      <div class="label">KIOSKVERTER</div>
      <h1>Hasle-Løren U10</h1>
      <div class="sub">Takk for innsatsen!</div>
    </div>
  </div>
</body>
</html>
