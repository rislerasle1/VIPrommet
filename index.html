<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hasle-Løren Infoskjerm</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: white;
    }

    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      opacity: 0;
      visibility: hidden;
    }

    .slide.active {
      opacity: 1;
      visibility: visible;
    }
  </style>
</head>

<body>

  <iframe class="slide active" id="side1"></iframe>

  <iframe class="slide" id="side2"></iframe>

  <iframe class="slide" id="side3"></iframe>


  <script>

    // Én versjon per innlasting.
    // Gjør at vi får ferskt innhold når siden oppdateres,
    // men ikke henter data ved hver rotasjon.
    const version = Date.now();

    document.getElementById("side1").src =
      "side1.html?v=" + version;

    document.getElementById("side2").src =
      "https://docs.google.com/spreadsheets/d/1u-Uobmn4ogPwt9qcqFG272O6tlxlRR_oZ2cjh2VpCYo/htmlview?v=" + version;

    document.getElementById("side3").src =
      "side3.html?v=" + version;


    // ROTASJON
    const slides = document.querySelectorAll(".slide");

    let currentSlide = 0;

    setInterval(() => {

      slides[currentSlide].classList.remove("active");

      currentSlide++;

      if (currentSlide >= slides.length) {
        currentSlide = 0;
      }

      slides[currentSlide].classList.add("active");

    }, 5000);


    // OPPDATER ALT HVER 30. MINUTT
    setTimeout(() => {

      window.location.replace(
        window.location.pathname + "?refresh=" + Date.now()
      );

    }, 1800000);

  </script>

</body>
</html>
