<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hasle-Løren Infoskjerm</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: white;
    }

    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      opacity: 0;
      visibility: hidden;
    }

    .slide.active {
      opacity: 1;
      visibility: visible;
    }
  </style>
</head>

<body>

  <iframe class="slide active" src="side1.html"></iframe>
  <iframe class="slide" src="side2.html"></iframe>
  <iframe class="slide" src="side3.html"></iframe>

  <script>
    const slides = document.querySelectorAll(".slide");

    let currentSlide = 0;

    setInterval(() => {

      slides[currentSlide].classList.remove("active");

      currentSlide++;

      if (currentSlide >= slides.length) {
        currentSlide = 0;
      }

      slides[currentSlide].classList.add("active");

    }, 5000);
  </script>

</body>
</html>
