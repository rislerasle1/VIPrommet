<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VIPrommet Infoskjerm</title>
  <style>
    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:#000;
    }
    .slide{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      border:0;
      opacity:0;
      visibility:hidden;
    }
    .slide.active{
      opacity:1;
      visibility:visible;
    }
  </style>
</head>
<body>
  <iframe class="slide active" id="slide0"></iframe>
  <iframe class="slide" id="slide1"></iframe>
  <iframe class="slide" id="slide2"></iframe>

  <script>
    const version = Date.now();

    const slides = [
      { el: document.getElementById("slide0"), src: "side1.html?v=" + version, duration: 7000 },
      { el: document.getElementById("slide1"), src: "side2.html?v=" + version, duration: 20000 },
      { el: document.getElementById("slide2"), src: "side3.html?v=" + version, duration: 5000 }
    ];

    slides.forEach(slide => {
      slide.el.src = slide.src;
    });

    let current = 0;

    function showSlide(index){
      slides.forEach((slide, i) => {
        slide.el.classList.toggle("active", i === index);
      });
    }

    function rotate(){
      const duration = slides[current].duration;

      setTimeout(() => {
        current = (current + 1) % slides.length;
        showSlide(current);
        rotate();
      }, duration);
    }

    showSlide(0);
    rotate();

    // Last hele infoskjermen på nytt hvert 30. minutt
    // Endre 1800000 til 3600000 hvis du vil oppdatere bare hver time.
    setTimeout(() => {
      window.location.replace(window.location.pathname + "?refresh=" + Date.now());
    }, 1800000);
  </script>
</body>
</html>
