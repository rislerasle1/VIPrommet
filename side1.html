<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiosken åpner</title>

<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #ffffff;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .topbar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 12px;
    background: #c8102e;
  }

  .content {
    text-align: center;
    padding: 24px 40px 36px;
  }

  .logo {
    display: block;
    max-width: min(220px, 28vw);
    max-height: 110px;
    width: auto;
    height: auto;
    margin: 0 auto 18px;
    object-fit: contain;
  }

  .kiosk {
    display: inline-block;
    padding: 10px 24px;
    margin-bottom: 24px;
    border-radius: 10px;
    background: #c8102e;
    color: white;
    font-size: clamp(22px, 2.5vw, 34px);
    font-weight: 900;
    letter-spacing: 0.08em;
  }

  h1 {
    margin: 0;
    color: #17324d;
    font-size: clamp(48px, 7vw, 96px);
    line-height: 1.05;
    font-weight: 900;
    opacity: 0;
    animation: titleIn 5s infinite;
  }

  .date {
    margin-top: 20px;
    color: #c8102e;
    font-size: clamp(46px, 6.5vw, 86px);
    line-height: 1;
    font-weight: 900;
    opacity: 0;
    animation: dateIn 5s infinite;
  }

  .line {
    width: min(360px, 50vw);
    height: 6px;
    margin: 30px auto 0;
    border-radius: 99px;
    background: #17324d;
    transform: scaleX(0);
    animation: lineIn 5s infinite;
  }

  @keyframes titleIn {
    0%   { opacity: 0; transform: translateY(18px); }
    14%  { opacity: 1; transform: translateY(0); }
    90%  { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-8px); }
  }

  @keyframes dateIn {
    0%, 10% { opacity: 0; transform: scale(0.96); }
    24%     { opacity: 1; transform: scale(1.03); }
    32%     { opacity: 1; transform: scale(1); }
    90%     { opacity: 1; transform: scale(1); }
    100%    { opacity: 0; transform: scale(0.99); }
  }

  @keyframes lineIn {
    0%, 18% { transform: scaleX(0); opacity: 0; }
    32%     { transform: scaleX(1); opacity: 1; }
    90%     { transform: scaleX(1); opacity: 1; }
    100%    { transform: scaleX(0.9); opacity: 0; }
  }
</style>
</head>

<body>
  <div class="topbar"></div>

  <div class="content">
    <img
      class="logo"
      src="https://cdn-bloc.no/background/200000195/7987/2026/4/23/hl_logo.png"
      alt="Hasle-Løren logo"
    >

    <div class="kiosk">KIOSKEN</div>

    <h1>Kiosken åpner</h1>
    <div class="date">7. september</div>
    <div class="line"></div>
  </div>
</body>
</html>
