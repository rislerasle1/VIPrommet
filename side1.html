<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiosken åpner</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(-45deg, #d40000, #ff5a00, #ffd000, #d40000);
      background-size: 400% 400%;
      animation: bgMove 10s ease infinite;
    }

    @keyframes bgMove {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      position: relative;
      z-index: 2;
      text-align: center;
      color: white;
      padding: 40px;
      max-width: 90%;
    }

    .badge {
      display: inline-block;
      padding: 12px 24px;
      margin-bottom: 24px;
      background: rgba(255,255,255,0.2);
      border: 2px solid rgba(255,255,255,0.45);
      border-radius: 999px;
      font-size: clamp(18px, 2vw, 32px);
      font-weight: bold;
      letter-spacing: 1px;
      backdrop-filter: blur(4px);
      animation: floatBadge 2.5s ease-in-out infinite;
    }

    @keyframes floatBadge {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-8px); }
    }

    h1 {
      margin: 0;
      line-height: 1.05;
      font-size: clamp(52px, 8vw, 120px);
      font-weight: 900;
      text-transform: uppercase;
      text-shadow: 0 4px 18px rgba(0,0,0,0.28);
      animation: popIn 1s ease-out;
    }

    .date {
      margin-top: 24px;
      font-size: clamp(40px, 7vw, 100px);
      font-weight: 900;
      color: #fff200;
      text-shadow: 0 4px 18px rgba(0,0,0,0.35);
      animation: pulseDate 1.4s ease-in-out infinite;
    }

    @keyframes pulseDate {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.1);
      }
    }

    .sub {
      margin-top: 26px;
      font-size: clamp(20px, 2.5vw, 36px);
      font-weight: bold;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.25);
      animation: blinkSoft 2s ease-in-out infinite;
    }

    @keyframes blinkSoft {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.65; }
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(0.7);
      }
      70% {
        opacity: 1;
        transform: scale(1.05);
      }
      100% {
        transform: scale(1);
      }
    }

    .icon {
      position: absolute;
      font-size: clamp(30px, 4vw, 60px);
      opacity: 0.9;
      animation: floatUp linear infinite;
      z-index: 1;
      user-select: none;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(120vh) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-20vh) rotate(360deg);
        opacity: 0;
      }
    }

    .i1  { left: 5%;  animation-duration: 9s;  animation-delay: 0s; }
    .i2  { left: 15%; animation-duration: 11s; animation-delay: 2s; }
    .i3  { left: 28%; animation-duration: 8s;  animation-delay: 1s; }
    .i4  { left: 40%; animation-duration: 10s; animation-delay: 3s; }
    .i5  { left: 52%; animation-duration: 12s; animation-delay: 0.5s; }
    .i6  { left: 64%; animation-duration: 9s;  animation-delay: 4s; }
    .i7  { left: 76%; animation-duration: 10s; animation-delay: 1.5s; }
    .i8  { left: 88%; animation-duration: 8.5s; animation-delay: 2.5s; }

    .shine {
      position: absolute;
      top: -20%;
      left: -30%;
      width: 40%;
      height: 140%;
      background: rgba(255,255,255,0.18);
      transform: rotate(20deg);
      animation: shineMove 4s linear infinite;
      z-index: 0;
    }

    @keyframes shineMove {
      0%   { left: -40%; }
      100% { left: 120%; }
    }
  </style>
</head>
<body>

  <div class="shine"></div>

  <div class="icon i1">🍿</div>
  <div class="icon i2">🥤</div>
  <div class="icon i3">🍫</div>
  <div class="icon i4">🍬</div>
  <div class="icon i5">🍿</div>
  <div class="icon i6">🥤</div>
  <div class="icon i7">🍫</div>
  <div class="icon i8">🍬</div>

  <div class="container">
    <div class="badge">HASLE LØREN KIOSK</div>
    <h1>Kiosken åpner</h1>
    <div class="date">7. september</div>
    <div class="sub">Snart klart for noe godt! 🍿🥤</div>
  </div>

</body>
</html>
