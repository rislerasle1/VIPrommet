<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kiosken status</title>
<style>
  :root{
    --bg:#f6f8fb;
    --ink:#112f4a;
    --red:#ef3e36;
    --muted:#708394;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(180deg,#f8fbfe 0%, #eef4f8 100%);
    color:var(--ink);
  }
  .screen{
    position:relative;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:4vh 4vw;
  }
  .panel{
    width:min(1000px,92vw);
    text-align:center;
  }
  .headline{
    min-height:1.4em;
    margin-bottom:1.6vh;
    font-size:clamp(28px,3.5vw,58px);
    line-height:1.05;
    font-weight:900;
    color:var(--red);
    letter-spacing:.01em;
  }
  .clock{
    font-size:clamp(82px,16vw,220px);
    line-height:0.95;
    font-weight:900;
    color:var(--ink);
    letter-spacing:.02em;
  }
  .subtext{
    min-height:1.3em;
    margin-top:1.8vh;
    font-size:clamp(24px,3vw,48px);
    line-height:1.15;
    font-weight:800;
    color:var(--ink);
  }
  .date{
    margin-top:1.4vh;
    font-size:clamp(16px,1.5vw,26px);
    color:var(--muted);
    font-weight:700;
  }
  .logo{
    position:absolute;
    right:2.2vw;
    bottom:2.4vh;
    width:min(150px,14vw);
    height:auto;
  }
</style>
</head>
<body>
<div class="screen">
  <div class="panel">
    <div class="headline" id="headline"></div>
    <div class="clock" id="clock">00:00:00</div>
    <div class="subtext" id="subtext"></div>
    <div class="date" id="date"></div>
  </div>

  <img class="logo" src="https://cdn-bloc.no/background/200000195/7987/2026/4/23/hl_logo.png" alt="Hasle-Løren">
</div>

<script>
  const dayNames = ["Søndag","Mandag","Tirsdag","Onsdag","Torsdag","Fredag","Lørdag"];
  const monthNames = ["januar","februar","mars","april","mai","juni","juli","august","september","oktober","november","desember"];

  function getHoursForDay(day){
    // 0 = søndag, 6 = lørdag
    if (day >= 1 && day <= 5) return { open: "17:00", close: "21:00" };
    return { open: "10:00", close: "18:00" };
  }

  function minutesFromTime(str){
    const [h,m] = str.split(":").map(Number);
    return h * 60 + m;
  }

  function format2(n){
    return String(n).padStart(2, "0");
  }

  function updateScreen(){
    const now = new Date();
    const day = now.getDay();
    const hrs = getHoursForDay(day);

    const currentMinutes = now.getHours() * 60 + now.getMinutes();
    const openMinutes = minutesFromTime(hrs.open);
    const closeMinutes = minutesFromTime(hrs.close);

    const clock = document.getElementById("clock");
    const headline = document.getElementById("headline");
    const subtext = document.getElementById("subtext");
    const date = document.getElementById("date");

    clock.textContent = `${format2(now.getHours())}:${format2(now.getMinutes())}:${format2(now.getSeconds())}`;
    date.textContent = `${dayNames[day]} ${now.getDate()}. ${monthNames[now.getMonth()]} ${now.getFullYear()}`;

    // Fra åpningstid til stengetid
    if (currentMinutes >= openMinutes && currentMinutes < closeMinutes){
      headline.textContent = "Kiosken er åpen";
      subtext.textContent = "";
    }
    // Mellom stengetid og midnatt: bare klokke
    else if (currentMinutes >= closeMinutes){
      headline.textContent = "";
      subtext.textContent = "";
    }
    // Når kiosken er stengt: vis neste åpning i dag
    else{
      headline.textContent = "";
      subtext.textContent = `Kiosken åpner kl ${hrs.open}`;
    }
  }

  updateScreen();
  setInterval(updateScreen, 1000);
</script>
</body>
</html>
